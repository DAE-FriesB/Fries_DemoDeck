# Pushing a version tag builds the installer and publishes it as a GitHub release:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Installed copies of the app find the new release and offer "Version 0.2.0 ready: restart".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag (v0.2.0 -> 0.2.0)
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/Ex.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o artifacts/publish

      - name: Restore vpk
        run: dotnet tool restore

      # The previous release lets vpk build a small delta update next to the full package.
      - name: Download previous release
        continue-on-error: true
        run: dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir artifacts/releases

      - name: Pack
        run: >-
          dotnet vpk pack
          --packId FriesDemoDeck
          --packVersion ${{ env.VERSION }}
          --packDir artifacts/publish
          --mainExe Ex.App.exe
          --packTitle "Fries' Demo Deck"
          --packAuthors FriesBoury
          --icon src/Ex.App/Assets/app.ico
          --outputDir artifacts/releases

      - name: Upload to the GitHub release
        run: >-
          dotnet vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Fries' Demo Deck ${{ env.VERSION }}"
          --tag ${{ github.ref_name }}
          --outputDir artifacts/releases
